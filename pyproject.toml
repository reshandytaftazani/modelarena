[project]
name = "modelarena"
version = "0.1.0"
description = "Local CPU-only, leakage-safe tabular ML experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.159.1",
    "pydantic==2.14.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "torch==2.14.1+cpu",
    "mlflow==3.17.2",
    "psutil==7.2.2",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
